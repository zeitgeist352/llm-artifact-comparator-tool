spring.application.name=Artifact Comparator Backend

# --- PostgreSQL Connection ---
spring.datasource.url=jdbc:postgresql://localhost:5432/artifact_db
spring.datasource.username=postgres
spring.datasource.password=postgres

# --- Hibernate / JPA Settings ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# --- Multipart (File Uploads) ---
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=artifactcomparator@gmail.com
spring.mail.password=*********
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- NEW: Gemini AI Configuration ---
gemini.api.key=*******
gemini.api.url=xxxxxxx
gemini.api.timeout=30000
